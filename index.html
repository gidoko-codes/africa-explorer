<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She is Africa Explorer</title>
</head>
<body>
    <h1>She is Africa Explorer</h1>
    <p>Search any African country.</p>
    <input type="text" id="searchBox" placeholder="Type a country name">
    <select id="regionFilter">
        <option value="all">All regions</option>
        <option value="North Africa">North Africa</option>
        <option value="West Africa">West Africa</option>
        <option value="East Africa">East Africa</option>
        <option value="Central Africa">Central Africa</option>
        <option value="Southern Africa">Southern Africa</option>
    </select>

    <select id="sortBy">
        <option value="name">Sort by name (A to Z)</option>
        <option value="population-high">Population: high to low</option>
        <option value="population-low">Population: low to high</option>
    </select>

    <p id="count"></p>
    <div id="results"></div>
    <script src="app.js"></script>
</body>
</html>
